<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillBridge AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: #38bdf8;
            font-size: 38px;
            margin-bottom: 10px;
        }

        header p {
            color: #94a3b8;
            font-size: 17px;
        }

        .form-box,
        .section {
            background: #1e293b;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            min-height: 160px;
            resize: vertical;
            padding: 15px;
            border: 1px solid #475569;
            border-radius: 10px;
            background: #0f172a;
            color: white;
            font-size: 16px;
            outline: none;
        }

        textarea:focus {
            border-color: #38bdf8;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #0284c7;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0369a1;
        }

        button:disabled {
            background: #475569;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            color: #38bdf8;
            margin: 20px;
        }

        .spinner {
            display: inline-block;
            width: 25px;
            height: 25px;
            border: 4px solid #334155;
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            vertical-align: middle;
            margin-right: 10px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error {
            display: none;
            background: #7f1d1d;
            color: #fecaca;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .results {
            display: none;
        }

        .section h2 {
            color: #38bdf8;
            border-bottom: 1px solid #475569;
            padding-bottom: 12px;
            margin-bottom: 18px;
        }

        .card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 15px;
        }

        .card h3 {
            color: #f8fafc;
            margin-bottom: 10px;
        }

        .card p {
            color: #cbd5e1;
            line-height: 1.6;
            margin: 7px 0;
        }

        .score {
            color: #4ade80 !important;
            font-weight: bold;
        }

        .tag {
            display: inline-block;
            background: #334155;
            color: #bae6fd;
            padding: 6px 10px;
            border-radius: 6px;
            margin: 4px;
            font-size: 13px;
        }

        .empty {
            color: #94a3b8;
            font-style: italic;
        }

        a {
            color: #38bdf8;
        }
    </style>
</head>

<body>
    <div class="container">

        <header>
            <h1>SkillBridge AI</h1>
            <p>
                Discover suitable careers, identify skill gaps,
                and find learning resources.
            </p>
        </header>

        <div class="form-box">
            <textarea
                id="profileText"
                placeholder="Enter your resume, skills, education, interests, and career goals..."></textarea>

            <button id="analyzeButton" onclick="analyzeProfile()">
                Analyze My Profile
            </button>
        </div>

        <div class="loading" id="loading">
            <span class="spinner"></span>
            Analyzing your profile. Please wait...
        </div>

        <div class="error" id="errorBox"></div>

        <div class="results" id="results">

            <div class="section">
                <h2>👤 Extracted Profile</h2>
                <div id="profileResult"></div>
            </div>

            <div class="section">
                <h2>💼 Recommended Jobs</h2>
                <div id="jobsResult"></div>
            </div>

            <div class="section">
                <h2>📚 Skill Gaps</h2>
                <div id="gapsResult"></div>
            </div>

            <div class="section">
                <h2>🎓 Recommended Courses</h2>
                <div id="coursesResult"></div>
            </div>

        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000/analyze";

        function escapeHTML(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Converts any value into an array safely.
        function toArray(value) {
            if (value === null || value === undefined) {
                return [];
            }

            if (Array.isArray(value)) {
                return value;
            }

            // Handle objects containing common list keys.
            if (typeof value === "object") {
                if (Array.isArray(value.items)) return value.items;
                if (Array.isArray(value.data)) return value.data;
                if (Array.isArray(value.results)) return value.results;
                if (Array.isArray(value.recommendations)) {
                    return value.recommendations;
                }

                return [value];
            }

            return [value];
        }

        function displayList(items) {
            const list = toArray(items);

            if (list.length === 0) {
                return '<span class="empty">No information available.</span>';
            }

            return list.map(item => {
                if (typeof item === "object") {
                    item = JSON.stringify(item);
                }

                return `<span class="tag">${escapeHTML(item)}</span>`;
            }).join("");
        }

        async function analyzeProfile() {
            const profileText = document
                .getElementById("profileText")
                .value
                .trim();

            const button = document.getElementById("analyzeButton");
            const loading = document.getElementById("loading");
            const errorBox = document.getElementById("errorBox");
            const results = document.getElementById("results");

            if (profileText.length < 10) {
                errorBox.textContent =
                    "Please enter at least 10 characters about your profile.";
                errorBox.style.display = "block";
                return;
            }

            button.disabled = true;
            loading.style.display = "block";
            errorBox.style.display = "none";
            results.style.display = "none";

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        raw_text: profileText
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.detail || "Analysis failed.");
                }

                const data = result.data || {};

                displayProfile(data.profile || {});
                displayJobs(data.matched_jobs || data.jobs || []);
                displayGaps(data.skill_gaps || data.gaps || []);
                displayCourses(
                    data.recommendations ||
                    data.recommended_courses ||
                    data.courses ||
                    []
                );

                results.style.display = "block";

            } catch (error) {
                errorBox.textContent =
                    "Error: " + error.message +
                    " Please check that the backend is running.";

                errorBox.style.display = "block";

            } finally {
                loading.style.display = "none";
                button.disabled = false;
            }
        }

        function displayProfile(profile) {
            const container = document.getElementById("profileResult");

            container.innerHTML = `
                <div class="card">
                    <p>
                        <strong>Name:</strong>
                        ${escapeHTML(profile.name || "Not provided")}
                    </p>

                    <p>
                        <strong>Education:</strong>
                        ${displayList(profile.education)}
                    </p>

                    <p>
                        <strong>Skills:</strong>
                        ${displayList(profile.skills)}
                    </p>

                    <p>
                        <strong>Experience:</strong>
                        ${displayList(profile.experience)}
                    </p>

                    <p>
                        <strong>Interests:</strong>
                        ${displayList(profile.interests)}
                    </p>

                    <p>
                        <strong>Location:</strong>
                        ${escapeHTML(profile.location || "Not provided")}
                    </p>
                </div>
            `;
        }

        function displayJobs(jobs) {
            const container = document.getElementById("jobsResult");
            const jobList = toArray(jobs);

            if (jobList.length === 0) {
                container.innerHTML =
                    '<p class="empty">No suitable jobs found.</p>';
                return;
            }

            container.innerHTML = jobList.map(item => {
                const job = item.job || item;

                const rawScore = Number(item.match_score ?? 0);
                const score = Math.max(
                    0,
                    Math.min(100, Math.round(rawScore * 100))
                );

                return `
                    <div class="card">
                        <h3>
                            ${escapeHTML(
                                job.title ||
                                job.name ||
                                "Untitled Job"
                            )}
                        </h3>

                        <p>
                            <strong>Company:</strong>
                            ${escapeHTML(job.company || "Not specified")}
                        </p>

                        <p>
                            <strong>Description:</strong>
                            ${escapeHTML(
                                job.description ||
                                "No description available."
                            )}
                        </p>

                        <p class="score">
                            Match Score: ${score}%
                        </p>

                        <p><strong>Required Skills:</strong></p>
                        ${displayList(job.required_skills)}

                        <p><strong>Missing Skills:</strong></p>
                        ${displayList(item.missing_skills)}
                    </div>
                `;
            }).join("");
        }

        function displayGaps(gaps) {
            const container = document.getElementById("gapsResult");
            const gapList = toArray(gaps);

            if (gapList.length === 0) {
                container.innerHTML =
                    '<p class="empty">No skill gaps identified.</p>';
                return;
            }

            container.innerHTML = gapList.map(gap => {
                if (typeof gap !== "object") {
                    return `
                        <div class="card">
                            <h3>${escapeHTML(gap)}</h3>
                        </div>
                    `;
                }

                return `
                    <div class="card">
                        <h3>
                            ${escapeHTML(
                                gap.skill ||
                                gap.name ||
                                gap.skill_name ||
                                "Skill Gap"
                            )}
                        </h3>

                        <p>
                            ${escapeHTML(
                                gap.reason ||
                                gap.description ||
                                gap.explanation ||
                                "Consider developing this skill."
                            )}
                        </p>

                        <p>
                            <strong>Priority:</strong>
                            ${escapeHTML(gap.priority || "Not specified")}
                        </p>
                    </div>
                `;
            }).join("");
        }

        function displayCourses(courses) {
            const container = document.getElementById("coursesResult");
            const courseList = toArray(courses);

            if (courseList.length === 0) {
                container.innerHTML =
                    '<p class="empty">No course recommendations available.</p>';
                return;
            }

            container.innerHTML = courseList.map(item => {
                const course = item.course || item;

                if (typeof course !== "object") {
                    return `
                        <div class="card">
                            <h3>${escapeHTML(course)}</h3>
                        </div>
                    `;
                }

                const courseLink = course.url || course.link || "";

                return `
                    <div class="card">
                        <h3>
                            ${escapeHTML(
                                course.title ||
                                course.name ||
                                "Recommended Course"
                            )}
                        </h3>

                        <p>
                            <strong>Platform:</strong>
                            ${escapeHTML(course.platform || "Not specified")}
                        </p>

                        <p>
                            ${escapeHTML(
                                course.description ||
                                course.reason ||
                                ""
                            )}
                        </p>

                        ${
                            courseLink
                            ? `
                                <p>
                                    <a
                                        href="${escapeHTML(courseLink)}"
                                        target="_blank"
                                        rel="noopener noreferrer">
                                        View Course
                                    </a>
                                </p>
                            `
                            : ""
                        }
                    </div>
                `;
            }).join("");
        }
    </script>
</body>
</html>
