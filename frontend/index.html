<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillBridge AI</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 30px;
            min-height: 100vh;
            background: #081522;
            color: white;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 42px;
        }

        h1 span {
            color: #22d3ee;
        }

        p {
            color: #b6c5d4;
            line-height: 1.6;
        }

        .box {
            background: #122638;
            border: 1px solid #29465c;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #45657d;
            background: #091824;
            color: white;
            font-size: 16px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 16px;
            border: none;
            border-radius: 10px;
            background: #16bce5;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
        }

        #message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            white-space: pre-wrap;
        }

        .success {
            background: #124b3b;
        }

        .error {
            background: #632c2c;
        }

        #results {
            display: none;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: #102334;
            border: 1px solid #29465c;
            border-radius: 15px;
            padding: 20px;
        }

        .full {
            grid-column: 1 / -1;
        }

        h2 {
            color: #22d3ee;
        }

        h3 {
            color: white;
        }

        .item {
            background: #091824;
            border-radius: 10px;
            padding: 15px;
            margin: 12px 0;
        }

        .tag {
            display: inline-block;
            background: #16465b;
            color: #9cecff;
            padding: 5px 9px;
            border-radius: 15px;
            margin: 4px;
            font-size: 13px;
        }

        a {
            display: inline-block;
            margin-top: 10px;
            padding: 9px 12px;
            border-radius: 7px;
            background: #1685a8;
            color: white;
            text-decoration: none;
        }

        .empty {
            color: #91a6b9;
        }

        @media (max-width: 750px) {
            body {
                padding: 15px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <header>
            <h1>Skill<span>Bridge</span> AI</h1>
            <p>Your personalized pathway from skills to career opportunities.</p>
        </header>

        <div class="box">
            <h2>Tell us about yourself</h2>

            <textarea id="profileText">I am a Computer Science engineering student interested in artificial intelligence and machine learning. I know Python, Java, SQL, HTML, CSS, and basic machine learning. I want to become an AI engineer.</textarea>

            <button id="analyzeButton" onclick="analyzeProfile()">
                Analyze My Profile
            </button>

            <div id="message"></div>
        </div>

        <div id="results">
            <div class="grid">

                <div class="card full">
                    <h2>👤 Your Profile</h2>
                    <div id="profileResults"></div>
                </div>

                <div class="card">
                    <h2>💼 Recommended Jobs</h2>
                    <div id="jobResults"></div>
                </div>

                <div class="card">
                    <h2>🧩 Skill Gaps</h2>
                    <div id="gapResults"></div>
                </div>

                <div class="card full">
                    <h2>📚 Recommended Courses</h2>
                    <div id="courseResults"></div>
                </div>

            </div>
        </div>
    </div>

    <script>
        async function analyzeProfile() {
            const text = document.getElementById("profileText").value.trim();
            const button = document.getElementById("analyzeButton");
            const message = document.getElementById("message");
            const results = document.getElementById("results");

            if (text.length < 10) {
                message.className = "error";
                message.textContent = "Please enter more profile details.";
                return;
            }

            button.disabled = true;
            button.textContent = "Analyzing...";
            message.className = "";
            message.textContent = "Please wait. Analyzing your profile...";
            results.style.display = "none";

            try {
                const response = await fetch("http://127.0.0.1:8000/analyze", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        raw_text: text
                    })
                });

                const responseText = await response.text();
                const data = JSON.parse(responseText);

                if (!response.ok) {
                    throw new Error(data.detail || "Backend error occurred.");
                }

                const result = data.data || data;

                showProfile(result.profile || {});
                showJobs(result.matched_jobs || []);
                showGaps(result.skill_gaps || []);
                showCourses(result.recommendations || []);

                results.style.display = "block";
                message.className = "success";
                message.textContent = "Analysis completed successfully.";

            } catch (error) {
                console.error(error);
                message.className = "error";
                message.textContent = "Error: " + error.message;
            }

            button.disabled = false;
            button.textContent = "Analyze My Profile";
        }

        function showProfile(profile) {
            const skills = profile.skills || [];
            const interests = profile.interests || [];

            document.getElementById("profileResults").innerHTML =
                "<p><b>Education:</b> " + (profile.education || "Not specified") + "</p>" +
                "<p><b>Experience:</b> " + (profile.experience || "Not specified") + "</p>" +
                "<p><b>Location:</b> " + (profile.location || "Not specified") + "</p>" +
                "<p><b>Skills:</b><br>" +
                skills.map(function(skill) {
                    return '<span class="tag">' + skill + '</span>';
                }).join("") +
                "</p><p><b>Interests:</b><br>" +
                interests.map(function(interest) {
                    return '<span class="tag">' + interest + '</span>';
                }).join("") +
                "</p>";
        }

        function showJobs(jobs) {
            const box = document.getElementById("jobResults");

            if (!jobs.length) {
                box.innerHTML = '<p class="empty">No suitable jobs found.</p>';
                return;
            }

            box.innerHTML = jobs.map(function(item) {
                const job = item.job || item;
                const score = Math.max(
                    0,
                    Math.min(100, Math.round((item.match_score || 0) * 100))
                );

                return '<div class="item">' +
                    "<h3>" + (job.title || job.name || "Recommended Job") + "</h3>" +
                    "<p><b>Company:</b> " + (job.company || "Not specified") + "</p>" +
                    "<p>" + (job.description || "No description available.") + "</p>" +
                    "<p><b>Match:</b> " + score + "%</p>" +
                    (job.url ? '<a href="' + job.url + '" target="_blank">View Job</a>' : "") +
                    "</div>";
            }).join("");
        }

        function showGaps(gaps) {
            const box = document.getElementById("gapResults");

            if (!gaps.length) {
                box.innerHTML = '<p class="empty">No skill gaps found.</p>';
                return;
            }

            box.innerHTML = gaps.map(function(gap) {
                return '<div class="item">' +
                    "<h3>" + (gap.skill || gap.name || "Skill Gap") + "</h3>" +
                    "<p>" + (gap.reason || gap.description || "Skill improvement recommended.") + "</p>" +
                    "</div>";
            }).join("");
        }

        function showCourses(courses) {
            const box = document.getElementById("courseResults");

            if (!courses.length) {
                box.innerHTML = '<p class="empty">No course recommendations found.</p>';
                return;
            }

            box.innerHTML = courses.map(function(item) {
                const course = item.course || item;

                return '<div class="item">' +
                    "<h3>" + (course.title || course.name || "Recommended Course") + "</h3>" +
                    "<p><b>Platform:</b> " + (course.platform || course.provider || "Not specified") + "</p>" +
                    "<p>" + (course.description || "No description available.") + "</p>" +
                    (course.url ? '<a href="' + course.url + '" target="_blank">Open Course</a>' : "") +
                    "</div>";
            }).join("");
        }
    </script>
</body>
</html>
